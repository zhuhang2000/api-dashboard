<div class="dashboard-section">
  <section class="topbar">
    <div>
      <h1>Codex 额度 <span class="title-badge" id="title-badge">0</span></h1>
      <div class="subline" id="last-refresh">未刷新</div>
    </div>
    <div class="top-actions">
      <button class="icon-button primary" id="refresh-button" title="刷新额度" aria-label="刷新额度">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.9 4M4 12A8 8 0 0 1 18.9 8M19 4v4h-4M5 20v-4h4"/></svg>
        <span>刷新</span>
      </button>
    </div>
  </section>

  <section class="summary-grid" aria-label="账户汇总">
    <div class="summary-item">
      <span>账户</span>
      <strong id="summary-total">0</strong>
    </div>
    <div class="summary-item">
      <span>可用</span>
      <strong id="summary-ready">0</strong>
    </div>
    <div class="summary-item">
      <span>低额度</span>
      <strong id="summary-low">0</strong>
    </div>
    <div class="summary-item">
      <span>异常</span>
      <strong id="summary-error">0</strong>
    </div>
  </section>

  <div class="status-line" id="status-line"></div>
  <section class="cards-grid" id="cards-grid" aria-live="polite"></section>

  <template id="account-card-template">
    <article class="account-card">
      <header class="account-header">
        <div class="account-title">
          <span class="status-dot"></span>
          <h2></h2>
        </div>
        <span class="plan-pill"></span>
      </header>
      <div class="quota-stack"></div>
      <div class="error-box"></div>
      <div class="card-actions">
        <button class="card-btn refresh-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14.9 4M4 12A8 8 0 0 1 18.9 8M19 4v4h-4M5 20v-4h4"/></svg>
          <span>刷新额度</span>
        </button>
      </div>
    </article>
  </template>
</div>
