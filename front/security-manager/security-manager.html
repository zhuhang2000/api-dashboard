<div class="security-wrapper">
  <!-- 密码验证弹窗模板 -->
  <template id="sec-modal-template">
    <div class="sec-modal-backdrop" id="sec-auth-modal">
      <div class="sec-modal-card">
        <button class="modal-close-btn" id="sec-modal-close" type="button" title="关闭弹窗">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="sec-modal-header">
          <div class="lock-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h3>安全控制台</h3>
          <p>该模块受密码保护，请输入管理员密码进行解锁</p>
        </div>
        <form class="lock-form" id="sec-modal-form">
          <input type="password" id="sec-modal-password-input" class="sec-input" placeholder="请输入管理员密码"
            autocomplete="current-password" required autofocus />
          <div class="lock-error" id="sec-modal-error" style="display: none;"></div>
          <div class="modal-actions">
            <button type="button" class="card-btn modal-cancel-btn" id="sec-modal-cancel">取消</button>
            <button type="submit" class="primary modal-submit-btn" id="sec-modal-submit">解锁并进入</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- 控制面板独立页面模板 -->
  <template id="sec-dashboard-template">
    <div class="security-page">
      <div class="topbar">
        <div class="security-title-group">
          <button class="card-btn back-btn" id="sec-back-btn" title="返回 Codex 额度看板">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>返回额度看板</span>
          </button>
          <h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            安全与日志控制台
            <span class="title-badge" id="sec-badge">0</span>
          </h2>
          <div class="subline" id="sec-subline">规则: cliproxy-401 | 上次同步: 未同步</div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="sec-refresh-btn" title="刷新状态">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 12a8 8 0 0 1-14.9 4M4 12A8 8 0 0 1 18.9 8M19 4v4h-4M5 20v-4h4" />
            </svg>
            <span>刷新</span>
          </button>
          <button class="icon-button" id="sec-lock-btn" title="锁定控制台">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>锁定并退出</span>
          </button>
        </div>
      </div>

      <!-- 汇总指标 -->
      <div class="summary-grid">
        <div class="summary-item" id="sec-item-banned">
          <span>当前封禁 IP 数</span>
          <strong id="sec-stat-banned">0</strong>
        </div>
        <div class="summary-item">
          <span>累计封禁拦截</span>
          <strong id="sec-stat-total-banned">0</strong>
        </div>
        <div class="summary-item">
          <span>累计失败尝试</span>
          <strong id="sec-stat-total-failed">0</strong>
        </div>
      </div>

      <!-- 操作栏 -->
      <div class="sec-actions-card">
        <form class="sec-ban-form" id="sec-ban-form">
          <input type="text" id="sec-ban-ip-input" class="sec-input" placeholder="输入欲封禁的 IPv4 或 IPv6 地址" required />
          <button type="submit" class="btn-danger">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            <span>封禁 IP</span>
          </button>
        </form>

        <button class="btn-warning-outline" id="sec-unban-all-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          <span>一键解封所有规则下的 IP</span>
        </button>
      </div>

      <!-- 封禁 IP 列表 -->
      <div class="sec-ip-card">
        <div class="sec-ip-header">
          <h4>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M3 9h18M9 21V9" />
            </svg>
            当前被封禁的 IP 列表
          </h4>
          <span class="sec-ip-count" id="sec-ip-count">共 0 个 IP</span>
        </div>

        <div class="sec-empty-state" id="sec-empty-state" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <div>当前没有被封禁的 IP，系统防护正常</div>
        </div>

        <table class="sec-ip-table" id="sec-ip-table" style="display: none;">
          <thead>
            <tr>
              <th>IP 地址</th>
              <th>类型</th>
              <th style="text-align: right;">操作</th>
            </tr>
          </thead>
          <tbody id="sec-ip-tbody"></tbody>
        </table>
      </div>

      <!-- IP 请求频次统计分析模块 (count_ips.py) -->
      <div class="sec-stats-card">
        <div class="sec-stats-header">
          <div class="sec-stats-title">
            <h4>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              日志 IP 请求频次统计榜
            </h4>
            <span class="sec-stats-subline" id="sec-stats-span">未运行统计</span>
          </div>
          <button class="icon-button primary" id="sec-run-stats-btn" title="执行分析">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>执行统计</span>
          </button>
        </div>

        <!-- 统计指标网格 -->
        <div class="summary-grid sec-meta-grid" id="sec-stats-meta-grid" style="display: none;">
          <div class="summary-item">
            <span>独立 IP 数量</span>
            <strong id="sec-meta-unique">0</strong>
          </div>
          <div class="summary-item">
            <span>总匹配次数</span>
            <strong id="sec-meta-matches">0</strong>
          </div>
          <div class="summary-item">
            <span>读取总行数</span>
            <strong id="sec-meta-lines">0</strong>
          </div>
        </div>

        <div class="sec-empty-state" id="sec-stats-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <div>暂无 IP 频次统计数据，点击右上角「执行统计」运行分析</div>
        </div>

        <div class="sec-table-wrapper" id="sec-stats-table-wrapper" style="display: none;">
          <table class="sec-ip-table" id="sec-stats-table">
            <thead>
              <tr>
                <th style="width: 70px;">排名</th>
                <th>IP 地址</th>
                <th style="width: 120px;">调用次数</th>
                <th style="width: 180px;">占比</th>
                <th style="text-align: right; width: 140px;">操作</th>
              </tr>
            </thead>
            <tbody id="sec-stats-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <!-- 封禁 IP 列表单行模板 -->
  <template id="sec-ip-row-template">
    <tr>
      <td>
        <span class="ip-mono-badge"></span>
      </td>
      <td>
        <span class="ip-type-badge"></span>
      </td>
      <td>
        <div class="ip-row-actions">
          <button class="card-btn copy-btn" type="button">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>复制</span>
          </button>
          <button class="card-btn unban-btn" type="button">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
            <span>解封</span>
          </button>
        </div>
      </td>
    </tr>
  </template>

  <!-- IP 频次统计行模板 -->
  <template id="sec-stats-row-template">
    <tr>
      <td>
        <span class="rank-badge"></span>
      </td>
      <td>
        <div class="ip-group">
          <span class="ip-mono-badge"></span>
          <span class="ip-type-badge"></span>
          <span class="ip-banned-pill" style="display: none;">已封禁</span>
        </div>
      </td>
      <td>
        <strong class="stat-count"></strong>
      </td>
      <td>
        <div class="stat-percent-cell">
          <div class="stat-progress-track">
            <div class="stat-progress-fill"></div>
          </div>
          <span class="stat-percent-text"></span>
        </div>
      </td>
      <td>
        <div class="ip-row-actions">
          <button class="card-btn copy-btn" type="button">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>复制</span>
          </button>
          <button class="card-btn quick-ban-btn" type="button">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            <span>封禁</span>
          </button>
        </div>
      </td>
    </tr>
  </template>
</div>
