<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex 额度看板</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <h1>Codex 额度看板</h1>
          <div class="subline" id="last-refresh">未刷新</div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="oauth-button" title="添加 OAuth 授权" aria-label="添加 OAuth 授权">
            <span class="icon">+</span>
            <span>OAuth</span>
          </button>
          <button class="icon-button primary" id="refresh-button" title="刷新额度" aria-label="刷新额度">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.9 4M4 12A8 8 0 0 1 18.9 8M19 4v4h-4M5 20v-4h4"/></svg>
            <span>刷新</span>
          </button>
        </div>
      </section>

      <section class="settings-panel">
        <label>
          <span>CPA 地址</span>
          <input id="cpa-base-url" type="url" autocomplete="off" placeholder="http://127.0.0.1:8317">
        </label>
        <label>
          <span>管理密钥</span>
          <input id="management-key" type="password" autocomplete="off" placeholder="留空则保持不变">
        </label>
        <label class="small-field">
          <span>自动刷新</span>
          <select id="refresh-interval">
            <option value="0">关闭</option>
            <option value="30">30s</option>
            <option value="60">60s</option>
            <option value="300">5m</option>
          </select>
        </label>
        <button id="save-settings" class="secondary-button">保存</button>
      </section>

      <section class="summary-grid" aria-label="账户汇总">
        <div class="summary-item">
          <span>账户</span>
          <strong id="summary-total">0</strong>
        </div>
        <div class="summary-item">
          <span>可用</span>
          <strong id="summary-ready">0</strong>
        </div>
        <div class="summary-item">
          <span>低额度</span>
          <strong id="summary-low">0</strong>
        </div>
        <div class="summary-item">
          <span>异常</span>
          <strong id="summary-error">0</strong>
        </div>
      </section>

      <div class="status-line" id="status-line"></div>
      <section class="cards-grid" id="cards-grid" aria-live="polite"></section>
    </main>

    <template id="account-card-template">
      <article class="account-card">
        <header class="account-header">
          <div class="account-title">
            <span class="status-dot"></span>
            <h2></h2>
          </div>
          <span class="plan-pill"></span>
        </header>
        <div class="meta-line account-id"></div>
        <div class="meta-line status-message"></div>
        <div class="quota-stack"></div>
        <div class="error-box"></div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
