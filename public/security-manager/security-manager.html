<div class="security-section">
  <!-- 锁定视图模板 -->
  <template id="sec-lock-template">
    <div class="security-lock-card">
      <div class="lock-icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h3>Fail2ban 防护管理</h3>
      <p>请输入管理密码以解锁 IP 封禁与防御控制台</p>
      <form class="lock-form" id="sec-lock-form">
        <input
          type="password"
          id="sec-password-input"
          class="sec-input"
          placeholder="请输入管理密码"
          autocomplete="current-password"
          required
        />
        <button type="submit" class="primary" style="width: 100%; justify-content: center; height: 38px;">
          解锁管理
        </button>
      </form>
      <div class="lock-error" id="sec-lock-error" style="display: none;"></div>
    </div>
  </template>

  <!-- 仪表盘主视图模板 -->
  <template id="sec-dashboard-template">
    <div class="security-topbar">
      <div class="security-title-group">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Fail2ban 安全管理
          <span class="title-badge" id="sec-badge">0</span>
        </h2>
        <div class="subline" id="sec-subline">规则: cliproxy-401 | 上次同步: 未同步</div>
      </div>
      <div class="security-top-actions">
        <button class="icon-button" id="sec-refresh-btn" title="刷新状态">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 0 1-14.9 4M4 12A8 8 0 0 1 18.9 8M19 4v4h-4M5 20v-4h4"/></svg>
          <span>刷新</span>
        </button>
        <button class="icon-button" id="sec-lock-btn" title="锁定管理模块">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>锁定</span>
        </button>
      </div>
    </div>

    <!-- 汇总指标 -->
    <div class="summary-grid">
      <div class="summary-item" id="sec-item-banned">
        <span>当前封禁 IP 数</span>
        <strong id="sec-stat-banned">0</strong>
      </div>
      <div class="summary-item">
        <span>累计封禁拦截</span>
        <strong id="sec-stat-total-banned">0</strong>
      </div>
      <div class="summary-item">
        <span>累计失败尝试</span>
        <strong id="sec-stat-total-failed">0</strong>
      </div>
    </div>

    <!-- 操作栏 -->
    <div class="sec-actions-card">
      <form class="sec-ban-form" id="sec-ban-form">
        <input
          type="text"
          id="sec-ban-ip-input"
          class="sec-input"
          placeholder="输入欲封禁的 IPv4 或 IPv6 地址"
          required
        />
        <button type="submit" class="btn-danger">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
          <span>封禁 IP</span>
        </button>
      </form>

      <button class="btn-warning-outline" id="sec-unban-all-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        <span>一键解封所有规则下的 IP</span>
      </button>
    </div>

    <!-- 封禁 IP 列表 -->
    <div class="sec-ip-card">
      <div class="sec-ip-header">
        <h4>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          当前被封禁的 IP 列表
        </h4>
        <span class="sec-ip-count" id="sec-ip-count">共 0 个 IP</span>
      </div>

      <div class="sec-empty-state" id="sec-empty-state" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <div>当前没有被封禁的 IP，系统防护正常</div>
      </div>

      <table class="sec-ip-table" id="sec-ip-table" style="display: none;">
        <thead>
          <tr>
            <th>IP 地址</th>
            <th>类型</th>
            <th style="text-align: right;">操作</th>
          </tr>
        </thead>
        <tbody id="sec-ip-tbody"></tbody>
      </table>
    </div>
  </template>

  <!-- IP 列表单行模板 -->
  <template id="sec-ip-row-template">
    <tr>
      <td>
        <span class="ip-mono-badge"></span>
      </td>
      <td>
        <span class="ip-type-badge"></span>
      </td>
      <td>
        <div class="ip-row-actions">
          <button class="card-btn copy-btn" type="button">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span>复制</span>
          </button>
          <button class="card-btn unban-btn" type="button">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
            <span>解封</span>
          </button>
        </div>
      </td>
    </tr>
  </template>
</div>
